<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio de test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 2.5rem;
      color: #222;
    }

    .intro {
      color: #666;
      margin-bottom: 48px;
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #222;
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .skill {
      padding: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    footer {
      padding: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      border-top: 1px solid #ddd;
      background: #fff;
    }

    @media (max-width: 600px) {
      main {
        padding: 50px 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .skills {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Portfolio de test</h1>

    <p class="intro">
      Bienvenue sur cette page de présentation générique. Cet espace présente
      quelques compétences fictives dans un format simple et sobre.
    </p>

    <section>
      <h2>Compétences</h2>

      <div class="skills">
        <div class="skill">Créativité numérique</div>
        <div class="skill">Organisation avancée</div>
        <div class="skill">Analyse fictive</div>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 — Portfolio de test
  </footer>
</body>
</html>
